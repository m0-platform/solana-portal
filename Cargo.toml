[workspace]
members = ["programs/*", "packages/*", "tests", "cli"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
anchor-client = "1.2.0"
solana-keccak-hasher = { version = "3", features = ["sha3"] }
solana-security-txt = "1.1.1"
cfg-if = "1.0"
borsh = "1.5"
