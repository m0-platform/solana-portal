[package]
name = "portal-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "portal-cli"
path = "src/main.rs"


[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.21"
bs58 = "0.5"
hex = "0.4"
anchor-client.workspace = true
anchor-lang.workspace = true
m0-portal-common = { path = "../packages/common", features = ["executor"] }
wormhole-adapter = { path = "../programs/wormhole-adapter" }
solana-account-decoder-client-types = "3.1"
solana-rpc-client-types = "3.1"
solana-rpc-client = "3.1"
solana-sdk = "3.0"
solana-compute-budget-interface = { version = "3", features = ["borsh"] }
solana-address-lookup-table-interface = { version = "3.2", features = ["bincode"] }
solana-commitment-config = "3.1"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-client = "3.1"
solana-transaction-status-client-types = "3.1"
bincode = "1.3"
anchor-lang-032 = { package = "anchor-lang", version = "0.32.1" }
executor-account-resolver-svm = { version = "0.0.1", git = "https://github.com/wormholelabs-xyz/executor-account-resolver-svm", rev = "c180f40149bbb48e019e95d5a5daa1512fe063ac" }
borsh.workspace = true
alloy = { version = "0.7", features = ["full"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
