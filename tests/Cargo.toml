[package]
name = "tests"
version = "0.1.0"
edition = "2021"

[lib]
test = true

[dependencies]
tokio = { version = "1.41", features = ["full"] }
solana-client = "3.1"
solana-sdk = "3.0"
solana-compute-budget-interface = { version = "3", features = ["borsh"] }
solana-address-lookup-table-interface = { version = "3.2", features = ["bincode"] }
solana-commitment-config = "3.1"
solana-system-interface = { version = "3", features = ["bincode"] }
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
hex = "0.4"
once_cell = "1.20"
ctor = "0.2"
m0-portal-common = { path = "../packages/common" }
portal = { path = "../programs/portal" }
wormhole-adapter = { path = "../programs/wormhole-adapter" }
hyperlane-adapter = { path = "../programs/hyperlane-adapter" }
anchor-lang.workspace = true
solana-transaction-status-client-types = "3.1"
anchor-spl.workspace = true
spl-token-2022 = { package = "spl-token-2022-interface", version = "2.1" }
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "2.0.0"

[dev-dependencies]
anchor-client.workspace = true
hex = "0.4"
